[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-deepseek-harness-mcp"
version = "0.1.0"
description = "Task-level MCP bridge to the official DeepSeek Harness runtime"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "deepseek-harness-sdk==0.1.5rc1",
  "mcp==1.30.0",
  "psutil==7.2.2",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.4.0", "ruff==0.16.7", "PyYAML==6.0.3"]

[project.urls]
Repository = "https://github.com/RichardHu6666/dsh-in-codex"
Issues = "https://github.com/RichardHu6666/dsh-in-codex/issues"

[project.scripts]
harness-mcp = "harness_mcp.server:main"
harness-dsh = "harness_mcp.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.runtime/pytest"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".runtime", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
