# Replace both directories. Run init for the task root before connecting.
[mcp_servers.deepseek_harness]
command = "node"
args = ["/opt/dsh-in-codex/bin/cli.cjs", "serve", "--root", "/home/you/projects/my-app"]
env_vars = ["DEEPSEEK_API_KEY", "DEEPSEEK_BASE_URL", "HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY"]
startup_timeout_sec = 60
tool_timeout_sec = 70

[mcp_servers.deepseek_harness.env]
HARNESS_MCP_MAX_CONCURRENCY = "8"
